<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contagem de estoque</title>
<style>
  :root{
    --bg:#f4f5f2; --card:#ffffff; --ink:#1c2321; --mute:#66706c; --line:#d9ddd8;
    --ok:#14532d; --okink:#ffffff; --warn:#b45309; --err:#b91c1c; --accent:#0f766e;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141816; --card:#1d2321; --ink:#e8ece9; --mute:#98a39e; --line:#333b38;
           --ok:#22a05a; --okink:#06130b; --warn:#f59e0b; --err:#f87171; --accent:#2dd4bf; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  main{max-width:560px;margin:0 auto;padding:12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  h1{font-size:1.15rem;margin:0}
  .status{font-size:.85rem;color:var(--mute)}
  .status b{color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  #reader{width:100%;min-height:0;border-radius:8px;overflow:hidden;background:#000}
  #reader:empty{display:none}
  label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
  input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink)}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
  #qtd{font-size:1.6rem;font-weight:700;text-align:center}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  button{font:inherit;font-weight:600;padding:13px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--ok);color:var(--okink);border-color:transparent;font-size:1.05rem}
  button:disabled{opacity:.5}
  button.danger{color:var(--err)}
  [hidden]{display:none !important}
  input[type=range]{padding:0;height:32px}
  #reader{cursor:pointer}
  .prev{display:block;width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin-top:8px;background:var(--bg)}
  li .d b{color:var(--ink)}
  li[data-id]{cursor:pointer}
  li[data-id]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .msg{min-height:1.4em;font-size:.9rem;margin-top:8px}
  .msg.err{color:var(--err)} .msg.warn{color:var(--warn)} .msg.ok{color:var(--ok)}
  ul{list-style:none;margin:0;padding:0}
  li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-top:1px solid var(--line)}
  li:first-child{border-top:0}
  li .c{font-weight:600;word-break:break-all}
  li .q{font-weight:700;text-align:right}
  li .d{color:var(--mute);font-size:.85rem;grid-column:1/-1}
  li.pend .q::after{content:" ⏳";font-weight:400}
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(92vw,460px)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  h2{font-size:1rem;margin:0 0 4px}
  .small{font-size:.8rem;color:var(--mute)}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Contagem de estoque</h1>
      <div class="status" id="status">—</div>
    </div>
    <button id="btnCfg" aria-label="Configurações">⚙ Config</button>
  </header>

  <section class="card">
    <div id="reader"></div>
    <div id="camCtl" hidden>
      <p class="small" style="margin:6px 0 0">Se ficar borrado, afaste o celular uns 15 a 25 cm: de perto o foco não alcança. Toque na imagem para focar de novo.</p>
      <div id="zoomBox" hidden>
        <label for="zoom">Zoom</label>
        <input id="zoom" type="range">
      </div>
      <div id="focoBox" hidden>
        <label for="foco">Foco manual (arraste até ficar nítido)</label>
        <input id="foco" type="range">
      </div>
      <div class="row" style="margin-top:8px">
        <button type="button" id="btnRefocar" hidden>Refocar</button>
        <button type="button" id="btnLanterna" hidden>Lanterna</button>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnScan">Ler código</button>
      <button id="btnSync">Sincronizar</button>
    </div>

    <label for="setor">Setor</label>
    <select id="setor"></select>

    <label for="codigo">Código de barras</label>
    <input id="codigo" inputmode="text" autocomplete="off" placeholder="Leia ou digite e toque Enter">
    <button type="button" id="btnManual" style="width:100%;margin-top:6px">Item sem código? Gerar código manual</button>

    <label for="qtd">Quantidade</label>
    <input id="qtd" type="number" inputmode="decimal" min="0" step="any" placeholder="0">

    <label for="desc">Descrição</label>
    <input id="desc" autocomplete="off" placeholder="Breve descrição do item">

    <label for="cor">Cor (opcional)</label>
    <input id="cor" list="listaCores" autocomplete="off" placeholder="Ex.: azul">

    <label>Foto (opcional)</label>
    <div class="row">
      <button type="button" id="btnFoto">Tirar foto</button>
      <button type="button" id="btnFotoRem" hidden>Remover foto</button>
    </div>
    <input id="fileFoto" type="file" accept="image/*" capture="environment" hidden>
    <img id="prevFoto" class="prev" alt="Prévia da foto" hidden>

    <datalist id="listaCores"></datalist>
    <div class="msg" id="msg"></div>
    <button class="primary" id="btnSalvar" style="width:100%;margin-top:8px">Salvar contagem</button>
  </section>

  <section class="card">
    <h2>Últimas leituras deste aparelho</h2>
    <p class="small" style="margin:0 0 4px">Toque numa leitura para corrigir ou excluir.</p>
    <ul id="lista"></ul>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="frmCfg">
    <h2>Configurações</h2>
    <label for="cfgUrl">Link do Apps Script (termina em /exec)</label>
    <input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="cfgToken">Senha</label>
    <input id="cfgToken" placeholder="a mesma do Code.gs">
    <label for="cfgDupla">Nome da dupla</label>
    <input id="cfgDupla" placeholder="Ex.: Dupla 3 - Ana e João">
    <p class="small">Fica salvo só neste aparelho.</p>
    <div class="row" style="margin-top:8px">
      <button value="cancel">Cancelar</button>
      <button class="primary" id="cfgSalvar" value="ok">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgEdit">
  <form method="dialog" id="frmEdit">
    <h2>Corrigir leitura</h2>
    <label for="edCodigo">Código</label>
    <input id="edCodigo" autocomplete="off">
    <label for="edQtd">Quantidade</label>
    <input id="edQtd" type="number" inputmode="decimal" min="0" step="any">
    <label for="edDesc">Descrição</label>
    <input id="edDesc" autocomplete="off">
    <label for="edCor">Cor</label>
    <input id="edCor" list="listaCores" autocomplete="off">
    <label for="edSetor">Setor</label>
    <select id="edSetor"></select>
    <div class="row" style="margin-top:12px">
      <button value="cancel">Cancelar</button>
      <button class="danger" value="del">Excluir</button>
      <button class="primary" value="ok">Salvar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

let cfg   = load('cfg', { url:'', token:'', dupla:'' });
let fila  = load('fila', []);        // leituras ainda não enviadas
let hist  = load('hist', []);        // últimas leituras (para mostrar na tela)
let descs = load('descs', {});       // código -> descrição
let cores = load('cores', []);       // cores já usadas (sugestões)
const SETORES_PADRAO = Array.from({ length:9 }, (_, i) => 'Setor ' + (i + 1));
let setores = load('setores', SETORES_PADRAO);   // a lista oficial vem do Code.gs
let fotoAtual = '';                  // foto tirada, ainda não salva
let scanner = null, scanning = false, enviando = false;

// Fotos ficam no IndexedDB (cabem muito mais que o localStorage)
const idb = new Promise((res, rej) => {
  if (!window.indexedDB) return rej(new Error('sem IndexedDB'));
  const r = indexedDB.open('contagem', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('fotos');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
idb.catch(() => {});
const fotoPut = (k, v) => idb.then(db => new Promise((res, rej) => {
  const t = db.transaction('fotos', 'readwrite'); t.objectStore('fotos').put(v, k);
  t.oncomplete = res; t.onerror = () => rej(t.error);
}));
const fotoGet = k => idb.then(db => new Promise((res, rej) => {
  const r = db.transaction('fotos').objectStore('fotos').get(k);
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const fotoDel = k => idb.then(db => new Promise((res, rej) => {
  const t = db.transaction('fotos', 'readwrite'); t.objectStore('fotos').delete(k);
  t.oncomplete = res; t.onerror = () => rej(t.error);
})).catch(() => {});

function msg(t, tipo=''){ const m=$('msg'); m.textContent=t; m.className='msg '+tipo; }
function atualizaStatus(){
  const n = fila.length;
  $('status').innerHTML = (cfg.dupla ? '<b>'+esc(cfg.dupla)+'</b> · ' : 'Configure a dupla · ')
    + (n ? n+' pendente(s) de envio' : 'tudo sincronizado')
    + (navigator.onLine ? '' : ' · sem internet');
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function desenhaLista(){
  const pend = new Set(fila.map(i=>i.id));
  $('lista').innerHTML = hist.slice(0,30).map(i =>
    `<li tabindex="0" data-id="${esc(i.id)}" class="${pend.has(i.id)?'pend':''}"><span class="c">${esc(i.code)}</span><span class="q">${esc(i.qty)}</span>`
    + ((i.setor || i.desc || i.cor || i.foto)
        ? `<span class="d">${i.setor ? '<b>'+esc(i.setor)+'</b> ' : ''}${i.cor ? '<b>'+esc(i.cor)+'</b> ' : ''}${esc(i.desc || '')}${i.foto ? ' 📷' : ''}</span>` : '')
    + `</li>`).join('')
    || '<li><span class="d">Nenhuma leitura ainda.</span></li>';
}

// ---------- Validação das leituras ----------
// EAN-13, UPC-A e ITF-14 têm dígito verificador: se não bater, a leitura veio errada.
function gs1Ok(d){
  const n = d.length; let s = 0;
  for (let i = 0; i < n - 1; i++) s += Number(d[n-2-i]) * (i % 2 === 0 ? 3 : 1);
  return (10 - s % 10) % 10 === Number(d[n-1]);
}
let ult = { txt:'', n:0, t:0 };
function candidato(txt){
  txt = String(txt).trim();
  if (!txt) return;
  const soNum = /^\d+$/.test(txt);
  let precisa = 3;                                   // sem dígito verificador: exige 3 leituras iguais seguidas
  if (soNum && [12,13,14].includes(txt.length)){
    if (!gs1Ok(txt)){ ult = { txt:'', n:0, t:0 }; msg('Leitura inválida (dígito errado). Continue mirando…', 'warn'); return; }
    precisa = 2;
  } else if (soNum && txt.length === 8 && gs1Ok(txt)){
    precisa = 2;
  }
  const agora = Date.now();
  if (txt === ult.txt && agora - ult.t < 1500) ult.n++; else ult = { txt, n:1, t:agora };
  ult.t = agora;
  if (ult.n >= precisa){ ult = { txt:'', n:0, t:0 }; aoLer(txt); }
}

// ---------- Controles da câmera (zoom, foco, lanterna) ----------
let lanterna = false;
function trilha(){
  const v = document.querySelector('#reader video');
  return v && v.srcObject ? v.srcObject.getVideoTracks()[0] : null;
}
function configuraCamera(){
  $('camCtl').hidden = false;
  const t = trilha();
  if (!t || !t.getCapabilities) return;
  const cap = t.getCapabilities(), modos = cap.focusMode || [];
  if (modos.includes('continuous')) t.applyConstraints({ advanced:[{ focusMode:'continuous' }] }).catch(()=>{});
  if (cap.zoom){
    const z = $('zoom');
    z.min = cap.zoom.min; z.max = cap.zoom.max; z.step = cap.zoom.step || 0.1;
    const guardado = Number(load('zoom', 0));
    z.value = guardado >= cap.zoom.min && guardado <= cap.zoom.max ? guardado : (t.getSettings().zoom || cap.zoom.min);
    $('zoomBox').hidden = false;
    t.applyConstraints({ advanced:[{ zoom:Number(z.value) }] }).catch(()=>{});
  }
  if (cap.focusDistance){
    const f = $('foco');
    f.min = cap.focusDistance.min; f.max = cap.focusDistance.max; f.step = cap.focusDistance.step || 0.01;
    f.value = cap.focusDistance.min;
    $('focoBox').hidden = false;
  }
  $('btnRefocar').hidden = !modos.length;
  $('btnLanterna').hidden = !cap.torch;
}
async function refocar(){
  const t = trilha(); if (!t || !t.getCapabilities) return;
  const modos = t.getCapabilities().focusMode || [];
  try{
    if (modos.includes('single-shot')){
      await t.applyConstraints({ advanced:[{ focusMode:'single-shot' }] });
      await new Promise(r => setTimeout(r, 900));
    } else if (modos.includes('manual')){
      await t.applyConstraints({ advanced:[{ focusMode:'manual' }] });
      await new Promise(r => setTimeout(r, 250));
    }
    if (modos.includes('continuous')) await t.applyConstraints({ advanced:[{ focusMode:'continuous' }] });
  }catch{}
}
async function alternaLanterna(){
  const t = trilha(); if (!t) return;
  try{
    await t.applyConstraints({ advanced:[{ torch: !lanterna }] });
    lanterna = !lanterna;
    $('btnLanterna').textContent = lanterna ? 'Lanterna ligada' : 'Lanterna';
  }catch{}
}

// ---------- Câmera ----------
async function iniciaScan(){
  if (scanning) return;
  $('reader').style.display = 'block';
  scanner = scanner || new Html5Qrcode('reader', {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,  Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE ],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  try{
    await scanner.start({ facingMode:'environment' },
      { fps:10,
        qrbox:(w,h)=>({ width:Math.min(w-20,360), height:Math.min(h,160) }),
        videoConstraints:{ facingMode:'environment', width:{ ideal:1920 }, height:{ ideal:1080 } } },
      txt => candidato(txt), () => {});
    scanning = true; $('btnScan').textContent = 'Parar câmera';
    ult = { txt:'', n:0, t:0 };
    configuraCamera();
  }catch(e){
    $('reader').style.display='none';
    msg('Não foi possível abrir a câmera. Permita o acesso ou digite o código.', 'err');
  }
}
async function paraScan(){
  if (!scanning) return;
  try{ await scanner.stop(); }catch{}
  scanning = false; $('reader').style.display='none'; $('btnScan').textContent='Ler código';
  $('camCtl').hidden = true; $('zoomBox').hidden = true; $('focoBox').hidden = true;
  $('btnRefocar').hidden = true; $('btnLanterna').hidden = true;
  lanterna = false; $('btnLanterna').textContent = 'Lanterna';
}
function aoLer(txt){
  if (navigator.vibrate) navigator.vibrate(60);
  paraScan();
  $('codigo').value = txt.trim();
  preencheDesc();
  $('qtd').focus(); $('qtd').select();
}
function preencheDesc(){
  const c = $('codigo').value.trim();
  if (!c) return;
  $('desc').value = descs[c] || '';
  const ja = hist.filter(i => i.code === c);
  if (ja.length){
    const tot = ja.reduce((s,i)=>s+Number(i.qty||0), 0);
    msg('Já contado neste aparelho: '+tot+' ('+ja.length+' leitura'+(ja.length>1?'s':'')+'). A nova quantidade será somada.', 'warn');
  }
  else if (descs[c]) msg('Item conhecido. Confira e digite a quantidade.', 'ok');
  else msg('Código novo: informe uma descrição.', 'warn');
}

// ---------- Salvar e enviar ----------
function novoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function montaCores(){
  const todas = new Set(cores);
  hist.forEach(i => { if (i.cor) todas.add(i.cor); });
  $('listaCores').innerHTML = Array.from(todas).sort().map(c => `<option value="${esc(c)}">`).join('');
}

function montaSetores(){
  const atual = $('setor').value || load('setor', '');
  const ops = setores.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  $('setor').innerHTML = '<option value="">Selecione o setor</option>' + ops;
  $('edSetor').innerHTML = '<option value="">(sem setor)</option>' + ops;
  if (setores.includes(atual)) $('setor').value = atual;
}

// Código manual padronizado (M00001, M00002...), numerado pelo servidor para não repetir entre as duplas
async function gerarManual(){
  if (!cfg.url || !cfg.token){ msg('Abra Config e preencha link e senha.', 'err'); return; }
  const atual = $('codigo').value.trim();
  if (/^M\d{5,}$/.test(atual)){ msg('Este item já tem o código manual '+atual+'. Salve a contagem antes de gerar outro.', 'warn'); return; }
  if (!navigator.onLine){ msg('Sem internet: o código manual precisa de conexão para não repetir entre as duplas.', 'err'); return; }
  $('btnManual').disabled = true; msg('Gerando código…');
  try{
    const r = await fetch(cfg.url + '?token=' + encodeURIComponent(cfg.token) + '&acao=proximo');
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Falha');
    await paraScan();
    $('codigo').value = j.codigo; $('desc').value = '';
    msg('Código manual: '+j.codigo+'. Escreva esse código numa etiqueta e cole no item. Descreva o item abaixo.', 'ok');
    $('qtd').focus();
  }catch{
    msg('Não consegui gerar o código. Verifique a conexão e a senha.', 'err');
  }finally{
    $('btnManual').disabled = false;
  }
}

function reduzFoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const fator = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * fator); c.height = Math.round(img.height * fator);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem inválida')); };
    img.src = url;
  });
}
function limpaFoto(){
  fotoAtual = ''; $('fileFoto').value = '';
  $('prevFoto').hidden = true; $('prevFoto').removeAttribute('src');
  $('btnFotoRem').hidden = true; $('btnFoto').textContent = 'Tirar foto';
}

let salvando = false;
async function salvar(){
  if (salvando) return;
  const code = $('codigo').value.trim(), qtd = $('qtd').value.trim(),
        desc = $('desc').value.trim(), cor = $('cor').value.trim(), setor = $('setor').value;
  if (!cfg.url || !cfg.token || !cfg.dupla){ msg('Abra Config e preencha link, senha e nome da dupla.', 'err'); return; }
  if (!code){ msg('Leia ou digite o código.', 'err'); return; }
  if (!setor){ msg('Selecione o setor.', 'err'); $('setor').focus(); return; }
  if (/^M\d{5,}$/.test(code) && !desc){ msg('Item com código manual precisa de descrição.', 'err'); $('desc').focus(); return; }
  if (qtd === '' || isNaN(Number(qtd)) || Number(qtd) < 0){ msg('Informe a quantidade.', 'err'); $('qtd').focus(); return; }

  salvando = true; $('btnSalvar').disabled = true;
  const item = { id:novoId(), ts:new Date().toISOString(), dupla:cfg.dupla, code, qty:Number(qtd), desc, cor, setor };
  let aviso = '';
  if (fotoAtual){
    try{ await fotoPut(item.id, fotoAtual); item.foto = true; }
    catch{ aviso = ' (a foto não pôde ser guardada neste aparelho)'; }
  }
  fila.push({ ...item, op:'add', qid:novoId() }); hist.unshift(item); hist = hist.slice(0,200);
  if (desc) descs[code] = desc;
  save('fila', fila); save('hist', hist); save('descs', descs);

  $('codigo').value=''; $('qtd').value=''; $('desc').value=''; $('cor').value=''; limpaFoto();
  msg('Salvo: '+code+' × '+item.qty+aviso, aviso ? 'warn' : 'ok');
  montaCores(); desenhaLista(); atualizaStatus();
  salvando = false; $('btnSalvar').disabled = false;
  enviar();
  iniciaScan();                        // já abre para o próximo item
}

async function enviar(){
  if (enviando || !fila.length || !cfg.url) return;
  enviando = true;
  try{
    const lote = []; let bytes = 0;
    for (const it of fila){
      const q = { ...it };
      if (q.foto && (q.op || 'add') === 'add'){
        try{ q.fotoB64 = (await fotoGet(q.id)) || ''; }catch{ q.fotoB64 = ''; }
      }
      const tam = (q.fotoB64 || '').length + 400;
      if (lote.length && (lote.length >= 40 || bytes + tam > 1500000)) break;
      lote.push(q); bytes += tam;
    }
    const r = await fetch(cfg.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ token:cfg.token, items:lote }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Falha');
    const k = i => i.qid || i.id;
    const enviados = new Set(lote.map(k));
    fila = fila.filter(i=>!enviados.has(k(i))); save('fila', fila);
    lote.forEach(i => { if (i.foto && (i.op || 'add') === 'add') fotoDel(i.id); });
    if (j.fotosComErro) msg(j.fotosComErro+' foto(s) não foram salvas no Drive. Avise quem configurou o Apps Script.'+(j.erroFoto ? ' Motivo: '+j.erroFoto : ''), 'err');
  }catch(e){
    if (String(e.message).includes('Senha')) msg('Senha incorreta. Verifique em Config.', 'err');
  }finally{
    enviando = false; desenhaLista(); atualizaStatus();
    if (fila.length && navigator.onLine) setTimeout(enviar, 1500);
  }
}

async function baixaDescricoes(){
  if (!cfg.url || !cfg.token) return;
  try{
    const r = await fetch(cfg.url + '?token=' + encodeURIComponent(cfg.token));
    const j = await r.json();
    if (j.ok){
      descs = Object.assign(j.desc, descs); save('descs', descs);
      cores = j.cores || []; save('cores', cores); montaCores();
      if (j.setores && j.setores.length){ setores = j.setores; save('setores', setores); montaSetores(); }
    }
  }catch{}
}

async function sincronizar(){
  msg('Sincronizando…');
  await enviar(); await baixaDescricoes();
  msg(fila.length ? 'Ainda há itens pendentes (sem conexão?).' : 'Sincronizado.', fila.length ? 'warn' : 'ok');
}

// ---------- Corrigir / excluir ----------
let editId = null;

function abreEdicao(id){
  const h = hist.find(i => i.id === id);
  if (!h) return;
  editId = id;
  $('edCodigo').value = h.code;
  $('edQtd').value = h.qty;
  $('edDesc').value = h.desc || '';
  $('edCor').value = h.cor || '';
  $('edSetor').value = h.setor || '';
  if (!$('edSetor').value) $('edSetor').selectedIndex = 0;
  $('dlgEdit').showModal();
}

// campos = { code, qty, desc, cor } para corrigir; null para excluir
function aplicaEdicao(id, campos){
  const idx = hist.findIndex(i => i.id === id);
  const pendente = fila.find(i => i.id === id && (i.op || 'add') === 'add');
  const direto = pendente && !enviando;      // ainda não saiu do aparelho: altera na própria fila

  if (campos){
    if (idx >= 0) Object.assign(hist[idx], campos);
    if (direto) Object.assign(pendente, campos);
    else fila.push({ op:'edit', id, qid:novoId(), ...campos });
    if (campos.desc) descs[campos.code] = campos.desc;
  } else {
    if (idx >= 0) hist.splice(idx, 1);
    if (direto){ fila = fila.filter(i => i.id !== id); fotoDel(id); }
    else fila.push({ op:'del', id, qid:novoId() });
  }
  save('fila', fila); save('hist', hist); save('descs', descs);
  montaCores(); desenhaLista(); atualizaStatus();
  msg(campos ? 'Leitura corrigida.' : 'Leitura excluída.', 'ok');
  enviar();
}

$('lista').addEventListener('click', e => {
  const li = e.target.closest('li[data-id]');
  if (li) abreEdicao(li.dataset.id);
});
$('lista').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const li = e.target.closest('li[data-id]');
  if (li) abreEdicao(li.dataset.id);
});
$('frmEdit').addEventListener('submit', e => {
  const acao = e.submitter && e.submitter.value;
  if (acao === 'ok'){
    const code = $('edCodigo').value.trim(), qty = $('edQtd').value.trim();
    if (!code || qty === '' || isNaN(Number(qty)) || Number(qty) < 0){
      e.preventDefault(); alert('Informe um código e uma quantidade válidos.'); return;
    }
    aplicaEdicao(editId, { code, qty:Number(qty), desc:$('edDesc').value.trim(), cor:$('edCor').value.trim(), setor:$('edSetor').value });
  } else if (acao === 'del'){
    if (!confirm('Excluir esta leitura?')){ e.preventDefault(); return; }
    aplicaEdicao(editId, null);
  }
});

// ---------- Eventos ----------
$('btnManual').onclick = gerarManual;
$('setor').addEventListener('change', () => save('setor', $('setor').value));
$('btnFoto').onclick = async () => { await paraScan(); $('fileFoto').click(); };
$('fileFoto').addEventListener('change', async () => {
  const f = $('fileFoto').files[0];
  if (!f) return;
  try{
    fotoAtual = await reduzFoto(f);
    $('prevFoto').src = fotoAtual; $('prevFoto').hidden = false;
    $('btnFotoRem').hidden = false; $('btnFoto').textContent = 'Trocar foto';
    msg('Foto pronta. Toque em Salvar contagem.', 'ok');
  }catch{ limpaFoto(); msg('Não consegui ler a foto. Tente de novo.', 'err'); }
});
$('btnFotoRem').onclick = limpaFoto;
$('cor').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); salvar(); } });
$('zoom').addEventListener('input', () => {
  const t = trilha(); const v = Number($('zoom').value);
  save('zoom', v);
  if (t) t.applyConstraints({ advanced:[{ zoom:v }] }).catch(()=>{});
});
$('foco').addEventListener('input', () => {
  const t = trilha();
  if (t) t.applyConstraints({ advanced:[{ focusMode:'manual', focusDistance:Number($('foco').value) }] }).catch(()=>{});
});
$('btnRefocar').onclick = refocar;
$('btnLanterna').onclick = alternaLanterna;
$('reader').addEventListener('click', refocar);
$('btnScan').onclick = () => scanning ? paraScan() : iniciaScan();
$('btnSalvar').onclick = salvar;
$('btnSync').onclick = sincronizar;
$('codigo').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); preencheDesc(); $('qtd').focus(); } });
$('codigo').addEventListener('change', preencheDesc);
$('qtd').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); $('desc').focus(); } });
$('desc').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); $('cor').focus(); } });
$('btnCfg').onclick = () => { $('cfgUrl').value=cfg.url; $('cfgToken').value=cfg.token; $('cfgDupla').value=cfg.dupla; $('dlg').showModal(); };
$('frmCfg').addEventListener('submit', e => {
  if (e.submitter && e.submitter.value === 'ok'){
    cfg = { url:$('cfgUrl').value.trim(), token:$('cfgToken').value.trim(), dupla:$('cfgDupla').value.trim() };
    save('cfg', cfg); atualizaStatus(); baixaDescricoes();
  }
});
window.addEventListener('online',  () => { atualizaStatus(); enviar(); });
window.addEventListener('offline', atualizaStatus);

montaCores(); montaSetores(); desenhaLista(); atualizaStatus();
if (!cfg.url) $('btnCfg').click(); else { baixaDescricoes(); enviar(); }
</script>
